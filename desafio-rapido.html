    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Rápido - Security+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.5s;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .timer {
            background: rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 20px;
            font-size: 2rem;
            font-weight: bold;
            backdrop-filter: blur(10px);
            border: 2px solid white;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: white;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 0.3s ease;
            width: 0%;
        }

        .question {
            background: white;
            border-radius: 18px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            animation: slideIn 0.3s ease;
            border-left: 5px solid #f59e0b;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question h3 {
            color: #1f2937;
            margin-bottom: 20px;
            font-size: 1.25rem;
            line-height: 1.6;
        }

        .option {
            padding: 18px 20px;
            border: 3px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            font-size: 1.05rem;
        }

        .option:hover {
            background: #f9fafb;
            border-color: #f59e0b;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: #f59e0b;
            background: #fef3c7;
            font-weight: 600;
        }

        .option.correct {
            border-color: #10b981;
            background: #d1fae5;
            font-weight: 600;
        }

        .option.incorrect {
            border-color: #ef4444;
            background: #fee2e2;
            font-weight: 600;
        }

        .explanation {
            margin-top: 20px;
            padding: 20px;
            background: #fef3c7;
            border-left: 5px solid #f59e0b;
            border-radius: 8px;
            display: none;
            line-height: 1.6;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            color: white;
            padding: 18px 45px;
            font-size: 1.1rem;
            margin: 30px auto;
            display: block;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
            padding: 12px 25px;
            font-size: 1rem;
            margin: 0 10px;
        }

        .results-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .results-modal.show {
            display: flex;
        }

        .results-content {
            background: white;
            padding: 50px;
            border-radius: 25px;
            max-width: 500px;
            text-align: center;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
            }
            to {
                transform: scale(1);
            }
        }

        .score-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 30px auto;
        }

        .time-badge {
            background: #f59e0b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }

        .topic-tag {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            .question {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Desafio Rápido</h1>
            <h2>20 questões para revisão</h2>
            <p>Teste seus conhecimentos em 15 minutos</p>
            <div class="timer" id="timer">15:00</div>
            <div class="stats-bar">
                <div class="stat-card">📊 20 questões</div>
                <div class="stat-card">⏱️ 15 minutos</div>
                <div class="stat-card" id="answered-count">✅ 0 respondidas</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div id="questions"></div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="resetQuiz()">🔄 Refazer</button>
            <button class="btn btn-primary" onclick="checkAnswers()">✅ Ver Resultados</button>
        </div>
    </div>

    <div class="results-modal" id="results-modal">
        <div class="results-content">
            <h2>Resultado</h2>
            <div class="score-circle" id="score-circle">0%</div>
            <p id="score-text" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
            <p id="time-result" style="font-size: 1rem; color: #64748b; margin-bottom: 20px;"></p>
            <button class="btn btn-primary" onclick="resetQuiz()" style="margin: 0 auto;">Novo Desafio</button>
        </div>
    </div>

    <script>
        // Banco de questões completo (70 questões)
        const fullQuiz = [
            // Capítulo 1 - Security Concepts
            {
                topic: "Security Concepts",
                q: "Qual pilar da tríade CIA garante que apenas pessoas autorizadas possam acessar as informações?",
                o: ["Disponibilidade", "Integridade", "Confidencialidade", "Autenticidade"],
                c: 2,
                e: "Confidencialidade garante que informações sejam acessíveis apenas por pessoas autorizadas."
            },
            {
                topic: "Security Concepts",
                q: "Um firewall é um exemplo de qual tipo de controle de segurança?",
                o: ["Detectivo", "Preventivo", "Corretivo", "Compensatório"],
                c: 1,
                e: "Firewall é um controle preventivo, pois atua antes do incidente para bloquear tráfego não autorizado."
            },
            {
                topic: "Security Concepts",
                q: "O que significa o princípio de defesa em profundidade?",
                o: ["Usar apenas um tipo de controle", "Múltiplas camadas de segurança", "Concentrar recursos em um ponto", "Eliminar controles redundantes"],
                c: 1,
                e: "Defesa em profundidade significa implementar múltiplas camadas de segurança. Se uma falhar, as outras protegem."
            },

            // Capítulo 2 - Threats & Vulnerabilities
            {
                topic: "Ameaças",
                q: "Qual ator de ameaça possui recursos ilimitados e realiza APT?",
                o: ["Script Kiddie", "Hacktivist", "Nation-state", "Insider Threat"],
                c: 2,
                e: "Nation-state possuem recursos ilimitados e realizam APTs (Advanced Persistent Threats)."
            },
            {
                topic: "Ameaças",
                q: "O que é phishing?",
                o: ["Ataque físico", "Email malicioso fingindo ser legítimo", "Varredura de portas", "Força bruta"],
                c: 1,
                e: "Phishing é um golpe onde o atacante envia emails falsos fingindo ser entidade legítima."
            },
            {
                topic: "Ameaças",
                q: "O que é ransomware?",
                o: ["Monitora atividades", "Criptografa dados e exige pagamento", "Auto-replicante", "Esconde presença"],
                c: 1,
                e: "Ransomware criptografa os dados da vítima e exige pagamento. BACKUP é a melhor defesa!"
            },

            // Capítulo 3 - Criptografia
            {
                topic: "Criptografia",
                q: "Qual tipo de criptografia usa a mesma chave para cifrar e decifrar?",
                o: ["Assimétrica", "Simétrica", "Hashing", "PKI"],
                c: 1,
                e: "Criptografia simétrica usa a mesma chave para criptografar e descriptografar."
            },
            {
                topic: "Criptografia",
                q: "Qual é o algoritmo simétrico padrão atual?",
                o: ["DES", "3DES", "AES", "RC4"],
                c: 2,
                e: "AES é o padrão atual de criptografia simétrica, com chaves de 128, 192 ou 256 bits."
            },
            {
                topic: "Criptografia",
                q: "O que é hashing?",
                o: ["Criptografia reversível", "Função one-way que gera hash de tamanho fixo", "Criptografia assimétrica", "Troca de chaves"],
                c: 1,
                e: "Hashing é uma função one-way que gera uma saída de tamanho fixo. Usado para verificar integridade."
            },

            // Capítulo 4 - IAM
            {
                topic: "IAM",
                q: "No modelo AAA, o que significa autenticação?",
                o: ["Definir permissões", "Verificar identidade", "Registrar ações", "Criptografar dados"],
                c: 1,
                e: "Autenticação verifica QUEM é o usuário. Autorização define O QUE pode fazer. Auditoria registra O QUE fez."
            },
            {
                topic: "IAM",
                q: "Qual modelo de controle de acesso é baseado em funções?",
                o: ["DAC", "MAC", "RBAC", "ABAC"],
                c: 2,
                e: "RBAC (Role-Based Access Control) baseia permissões em funções/cargos."
            },
            {
                topic: "IAM",
                q: "Qual é o protocolo de autenticação do Active Directory?",
                o: ["LDAP", "RADIUS", "Kerberos", "TACACS+"],
                c: 2,
                e: "Kerberos é o protocolo padrão do Active Directory, usando tickets em vez de senhas."
            },

            // Capítulo 5 - Arquitetura de Redes
            {
                topic: "Arquitetura",
                q: "O que acontece se o firewall EXTERNO de uma DMZ falhar?",
                o: ["Tudo comprometido", "Apenas DMZ comprometida, LAN protegida", "Apenas LAN comprometida", "Nada"],
                c: 1,
                e: "Se o firewall EXTERNO falhar, apenas os servidores na DMZ são comprometidos. A LAN permanece protegida."
            },
            {
                topic: "Arquitetura",
                q: "Qual a melhor solução para acesso remoto seguro?",
                o: ["FTP", "Telnet", "VPN", "HTTP"],
                c: 2,
                e: "VPN é a MELHOR solução para acessar recursos privados da internet."
            },
            {
                topic: "Arquitetura",
                q: "Qual ataque inunda a tabela CAM do switch?",
                o: ["ARP Spoofing", "MAC Flooding", "VLAN Hopping", "DHCP Spoofing"],
                c: 1,
                e: "MAC Flooding inunda a tabela CAM, fazendo o switch funcionar como hub."
            },

            // Capítulo 6 - Security Assessment
            {
                topic: "Assessment",
                q: "Qual a diferença entre IDS e IPS?",
                o: ["IDS detecta e bloqueia", "IDS detecta (passivo), IPS bloqueia (ativo)", "São iguais", "IDS é hardware"],
                c: 1,
                e: "IDS detecta e alerta (passivo). IPS detecta e bloqueia (ativo)."
            },
            {
                topic: "Assessment",
                q: "O que é um falso negativo?",
                o: ["Alerta incorreto", "Vulnerabilidade real NÃO detectada (GRAVE)", "Tráfego legítimo bloqueado", "Detecção correta"],
                c: 1,
                e: "False negative é quando o scanner deixa de detectar uma vulnerabilidade real. É o MAIS GRAVE."
            },
            {
                topic: "Assessment",
                q: "O que é um ataque de rainbow table?",
                o: ["Força bruta", "Tabela pré-computada de hashes", "Ataque de dicionário", "Ataque de rede"],
                c: 1,
                e: "Rainbow table é uma tabela pré-computada de hashes. É inútil se a senha tiver salt."
            },

            // Capítulo 7 - Vulnerability Management
            {
                topic: "Vulnerability",
                q: "O que é CVSS?",
                o: ["ID de vulnerabilidade", "Sistema de pontuação (0-10)", "Banco de dados", "Categoria de fraquezas"],
                c: 1,
                e: "CVSS é um sistema de pontuação para vulnerabilidades, de 0 a 10."
            },
            {
                topic: "Vulnerability",
                q: "O que é CVE?",
                o: ["Sistema de pontuação", "ID único para vulnerabilidades", "Banco de dados", "Categoria de fraquezas"],
                c: 1,
                e: "CVE é um identificador único para vulnerabilidades. Ex: CVE-2024-12345."
            },
            {
                topic: "Vulnerability",
                q: "O que é SIEM?",
                o: ["Firewall", "Sistema que correlaciona logs", "Antivírus", "Scanner"],
                c: 1,
                e: "SIEM coleta e correlaciona logs de múltiplas fontes para detectar ameaças."
            },

            // Capítulo 8 - Network & Endpoint
            {
                topic: "Wireless",
                q: "Qual é o padrão Wi-Fi mais seguro?",
                o: ["WEP", "WPA", "WPA2", "WPA3"],
                c: 3,
                e: "WPA3 é o padrão mais seguro, com SAE e Perfect Forward Secrecy."
            },
            {
                topic: "Wireless",
                q: "O que é um evil twin?",
                o: ["Dois roteadores", "AP falso com mesmo SSID (MITM)", "Ataque de força bruta", "Vulnerabilidade WPA2"],
                c: 1,
                e: "Evil twin é um AP falso com o mesmo SSID de um AP legítimo para capturar credenciais."
            },
            {
                topic: "Wireless",
                q: "O que é 802.1X?",
                o: ["Padrão Wi-Fi", "Autenticação por porta (RADIUS + EAP)", "Protocolo de rede", "Firewall"],
                c: 1,
                e: "802.1X é autenticação baseada em porta, usada em Wi-Fi Enterprise."
            },

            // Capítulo 9 - Incident Response
            {
                topic: "Incident Response",
                q: "Quais são as 6 fases do IR?",
                o: ["Detectar, Analisar, Conter", "Preparation, Identification, Containment, Eradication, Recovery, Lessons Learned", "Planejar, Executar, Controlar", "Não há fases"],
                c: 1,
                e: "As 6 fases são: Preparation, Identification, Containment, Eradication, Recovery, Lessons Learned."
            },
            {
                topic: "Incident Response",
                q: "O que é ordem de volatilidade?",
                o: ["Ordem de importância", "Coletar do mais volátil (CPU/RAM → Disco → Backups)", "Ordem de aquisição", "Tempo de retenção"],
                c: 1,
                e: "Ordem de volatilidade: coletar primeiro os dados mais voláteis: CPU/RAM, Disco, Logs, Backups."
            },
            {
                topic: "Incident Response",
                q: "O que é chain of custody?",
                o: ["Corrente", "Documentação de quem acessou a evidência", "Armazenamento seguro", "Backup"],
                c: 1,
                e: "Chain of custody documenta quem acessou a evidência, quando e por quê. Essencial para tribunal."
            },

            // Capítulo 10 - Virtualização
            {
                topic: "Virtualização",
                q: "Qual a diferença entre hypervisor Type 1 e Type 2?",
                o: ["Type 1 é mais lento", "Type 1 roda direto no hardware, Type 2 sobre SO", "São iguais", "Type 2 é mais seguro"],
                c: 1,
                e: "Type 1: roda diretamente no hardware (ESXi, Hyper-V). Type 2: roda sobre SO (VirtualBox)."
            },
            {
                topic: "Virtualização",
                q: "O que é SaaS?",
                o: ["Infraestrutura como serviço", "Software como serviço (Gmail)", "Plataforma como serviço", "Banco de dados"],
                c: 1,
                e: "SaaS fornece software pronto para uso. O cliente não gerencia nada, apenas usa."
            },
            {
                topic: "Virtualização",
                q: "O que é MDM?",
                o: ["Gerenciamento de aplicativos", "Gerenciamento de dispositivos móveis", "Firewall", "Antivírus"],
                c: 1,
                e: "MDM gerencia dispositivos móveis remotamente: políticas, remote wipe, push de apps."
            },

            // Capítulo 11 - Governance
            {
                topic: "Governança",
                q: "Qual a diferença entre Policy e Procedure?",
                o: ["São iguais", "Policy (alto nível), Procedure (passo a passo)", "Policy é opcional", "Procedure é estratégico"],
                c: 1,
                e: "Policy: documento de alto nível (POR QUE). Procedure: instruções passo a passo (COMO)."
            },
            {
                topic: "Governança",
                q: "O que é ISO 27001?",
                o: ["Padrão de criptografia", "Framework de ISMS", "Lei de privacidade", "Firewall"],
                c: 1,
                e: "ISO 27001 estabelece requisitos para um Sistema de Gestão de Segurança da Informação (ISMS)."
            },

            // Capítulo 12 - Risk Management
            {
                topic: "Risco",
                q: "O que significa RTO?",
                o: ["Dados perdidos", "Tempo máximo offline", "Frequência de backup", "Tempo entre falhas"],
                c: 1,
                e: "RTO é o tempo máximo que um sistema pode ficar offline após um desastre."
            },
            {
                topic: "Risco",
                q: "Qual a fórmula da ALE?",
                o: ["AV × EF", "SLE × ARO", "SLE + ARO", "AV × ARO"],
                c: 1,
                e: "ALE = SLE × ARO (perda anual esperada)."
            },

            // Capítulo 13 - Data Protection
            {
                topic: "Privacidade",
                q: "Qual é o prazo de notificação no GDPR?",
                o: ["24h", "72h", "7 dias", "30 dias"],
                c: 1,
                e: "GDPR exige notificação da violação em até 72 horas."
            },
            {
                topic: "Privacidade",
                q: "O que é um controlador de dados?",
                o: ["Processa dados", "Determina propósitos do processamento", "Armazena dados", "Audita dados"],
                c: 1,
                e: "Controlador determina os propósitos e meios de processar dados pessoais."
            },
            {
                topic: "Privacidade",
                q: "O que é direito ao esquecimento?",
                o: ["Acessar dados", "Solicitar apagamento de dados", "Corrigir dados", "Portar dados"],
                c: 1,
                e: "Direito ao esquecimento permite solicitar a exclusão de dados pessoais."
            }
        ];

        // Seleciona 20 questões aleatórias
        function getRandomQuestions() {
            const shuffled = [...fullQuiz].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 20);
        }

        let quiz = getRandomQuestions();
        let answers = {};
        let checked = false;
        let timerInterval;
        let timeLeft = 900; // 15 minutos em segundos

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timeLeft = 0;
                    checkAnswers();
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function loadQuestions() {
            const container = document.getElementById('questions');
            container.innerHTML = '';
            
            quiz.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'question';
                div.id = `q-${index}`;
                
                const topicTag = `<span class="topic-tag">${q.topic}</span>`;
                div.innerHTML = `<h3>${index + 1}. ${topicTag} ${q.q}</h3>`;
                
                q.o.forEach((opt, oi) => {
                    const odiv = document.createElement('div');
                    odiv.className = 'option';
                    odiv.textContent = opt;
                    odiv.onclick = () => selectOpt(index, oi);
                    odiv.id = `q${index}o${oi}`;
                    div.appendChild(odiv);
                });
                
                const exp = document.createElement('div');
                exp.className = 'explanation';
                exp.id = `exp${index}`;
                exp.innerHTML = `<strong>✓ Explicação:</strong> ${q.e}`;
                div.appendChild(exp);
                
                container.appendChild(div);
            });
            
            updateProgress();
            startTimer();
        }

        function selectOpt(qi, oi) {
            if (checked) return;
            
            quiz[qi].o.forEach((_, i) => {
                const el = document.getElementById(`q${qi}o${i}`);
                if (el) el.classList.remove('selected');
            });
            
            document.getElementById(`q${qi}o${oi}`).classList.add('selected');
            answers[qi] = oi;
            updateProgress();
        }

        function updateProgress() {
            const answered = Object.keys(answers).length;
            document.getElementById('answered-count').textContent = `✅ ${answered} respondidas`;
            const progress = (answered / quiz.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function checkAnswers() {
            clearInterval(timerInterval);
            checked = true;
            let correct = 0;
            
            quiz.forEach((q, qi) => {
                q.o.forEach((_, oi) => {
                    const el = document.getElementById(`q${qi}o${oi}`);
                    if (el) {
                        if (oi === q.c) {
                            el.classList.add('correct');
                        } else if (answers[qi] === oi) {
                            el.classList.add('incorrect');
                        }
                    }
                });
                
                const exp = document.getElementById(`exp${qi}`);
                if (exp) exp.style.display = 'block';
                
                if (answers[qi] === q.c) correct++;
            });
            
            const minutes = Math.floor((900 - timeLeft) / 60);
            const seconds = (900 - timeLeft) % 60;
            const timeSpent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            const pct = Math.round((correct / quiz.length) * 100);
            document.getElementById('score-circle').textContent = `${pct}%`;
            document.getElementById('score-text').textContent = 
                `${correct}/${quiz.length} corretas`;
            document.getElementById('time-result').textContent = 
                `Tempo: ${timeSpent} minutos`;
            document.getElementById('results-modal').classList.add('show');
        }

        function resetQuiz() {
            clearInterval(timerInterval);
            quiz = getRandomQuestions();
            answers = {};
            checked = false;
            timeLeft = 900;
            updateTimerDisplay();
            loadQuestions();
            document.getElementById('results-modal').classList.remove('show');
        }

        loadQuestions();
    </script>
</body>
</html>
